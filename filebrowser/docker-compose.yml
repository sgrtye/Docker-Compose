services:
  filebrowser:
    container_name: filebrowser
    image: ${APP_IMAGE:-gtstef/filebrowser:2-stable-slim}
    restart: unless-stopped
    ports:
      - 8800:80
    networks:
      - filebrowser
    volumes:
      - folder:/folder:rw
      - data:/home/filebrowser/data:rw

volumes:
  folder:
  data:

networks:
  filebrowser:
    driver: bridge