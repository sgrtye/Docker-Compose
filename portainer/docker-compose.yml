services:
  portainer:
    container_name: portainer
    image: ${APP_IMAGE:-portainer/portainer-ee:lts}
    restart: unless-stopped
    ports:
      - 9000:9000
    networks:
      - portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - data:/data:rw

volumes:
  data:

networks:
  portainer:
    driver: bridge