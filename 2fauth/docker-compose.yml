services:
  2fauth:
    container_name: 2fauth
    image: ${APP_IMAGE:-2fauth/2fauth:latest}
    restart: unless-stopped
    ports:
      - 8000:8000
    networks:
      - 2fauth
    volumes:
      - 2fauth:/2fauth:rw
    environment:
      - TRUSTED_PROXIES=*
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}

volumes:
  2fauth:

networks:
  2fauth:
    driver: bridge